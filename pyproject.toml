[project]
name = "mywork"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "audioop-lts>=0.2.2",
    "bs4>=0.0.2",
    "finance-datareader>=0.9.202",
    "folium>=0.20.0",
    "google-genai>=2.7.0",
    "gradio>=6.0,<7",
    "kiwipiepy>=0.24.1",
    "markdownify>=1.2.3",
    "matplotlib>=3.11.2",
    "nbformat>=5.11.1",
    "openai>=2.40.0",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "pydantic>=2.14.3",
    "pydub>=0.25.1",
    "pykrx>=1.0.51",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "seaborn>=0.13.2",
    "wikipedia_api>=0.16.0",
    "wordcloud>=1.9.6",
    "youtube-transcript-api>=1.2.5",
    "yt-dlp>=2026.10.26",
    "yt-dlp-ejs>=0.8.0",
]

[project.scripts]
mywork = "mywork:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
